# 두 프로젝트(blockchain_cluster, blockchain-indexer)가 공유하는 인프라.
# 원래 각자 docker-compose.yml을 갖고 있었으나, 둘 다 Kafka 호스트 포트(9092)를
# 써서 동시에 못 띄우는 문제가 있어 여기 하나로 합쳤다. Postgres는 프로젝트별로
# 분리 유지(스키마가 다름), Kafka/Kafka UI만 공유.
#
# 볼륨은 기존 개별 docker-compose로 만들어졌던 것과 이름을 맞춰서 그대로 재사용한다
# (데이터 유실 없음 — 특히 인덱서 chain_config의 실제 RPC 엔드포인트 값 보존).
services:
  cluster-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - cluster_postgres_data:/var/lib/postgresql/data
      - ./blockchain_cluster/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./blockchain_cluster/migrations/0002_create_app_user.sh:/docker-entrypoint-initdb.d/0002_create_app_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - indexer_postgres_data:/var/lib/postgresql/data
      - ./blockchain-indexer/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 실제 로그 디렉터리를 볼륨 마운트 경로와 일치시킨다 — 이걸 안 하면 이미지
      # 기본값(/tmp/kafka-logs)에 쓰기 때문에 아래 볼륨이 사실상 아무 데이터도
      # 못 받고, 컨테이너를 내리는 순간 토픽이 전부 유실된다(기존 인덱서
      # docker-compose.yml에 있던 버그, 여기서 확인하고 고쳤다).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 로컬 개발 전용 평문. 운영은 SASL/TLS로 전환 (인덱서 docs/06 §7).
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

volumes:
  cluster_postgres_data:
    name: blockchain_cluster_postgres_data
  indexer_postgres_data:
    name: blockchain-indexer_postgres-data
  kafka_data:
    name: blockchain-indexer_kafka-data
